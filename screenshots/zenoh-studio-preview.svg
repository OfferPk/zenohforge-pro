<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" style="background:#0b1120; font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif;">
  <rect width="1200" height="780" fill="#0b1120"/>
  <rect x="0" y="0" width="1200" height="64" fill="#0f172a"/>
  <circle cx="36" cy="32" r="14" fill="#38bdf8"/>
  <text x="36" y="37" fill="#0b1120" font-size="14" font-weight="900" text-anchor="middle">Z</text>
  <text x="64" y="38" fill="#f8fafc" font-size="20" font-weight="800">ZenohForge <tspan fill="#38bdf8">Pro</tspan></text>
  <rect x="210" y="22" width="70" height="20" rx="4" fill="#1e293b"/>
  <text x="245" y="36" fill="#94a3b8" font-size="11" font-weight="600" text-anchor="middle">v1.0.0</text>
  <rect x="880" y="20" width="280" height="26" rx="13" fill="#064e3b" stroke="#059669" stroke-width="1"/>
  <text x="1020" y="38" fill="#ecfdf5" font-size="12" font-weight="700" text-anchor="middle">ECLIPSE ZENOH v1.0.0 CERTIFIED</text>
  <g transform="translate(40, 90)">
    <rect width="360" height="640" rx="12" fill="#0f172a" stroke="#1e293b"/>
    <text x="24" y="36" fill="#e2e8f0" font-size="16" font-weight="700">Pub/Sub &amp; Query Dispatch</text>
    <rect x="20" y="70" width="320" height="50" rx="6" fill="#1e293b"/>
    <text x="36" y="100" fill="#38bdf8" font-size="13" font-family="monospace">robot/0/sensor/lidar</text>
    <rect x="20" y="140" width="320" height="90" rx="6" fill="#1e293b"/>
    <text x="36" y="170" fill="#94a3b8" font-size="12">Payload: {"points": 2048, "hz": 30}</text>
    <rect x="20" y="250" width="150" height="40" rx="6" fill="#0284c7"/>
    <text x="95" y="275" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">Publish (PUT)</text>
    <rect x="190" y="250" width="150" height="40" rx="6" fill="#334155"/>
    <text x="265" y="275" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">Query (GET)</text>
  </g>
  <g transform="translate(430, 90)">
    <rect width="230" height="110" rx="12" fill="#0f172a" stroke="#1e293b"/>
    <text x="20" y="32" fill="#94a3b8" font-size="12" font-weight="600">HEADER OVERHEAD</text>
    <text x="20" y="70" fill="#38bdf8" font-size="28" font-weight="800">6 <tspan font-size="16" fill="#64748b">bytes</tspan></text>
    <rect x="250" y="0" width="230" height="110" rx="12" fill="#0f172a" stroke="#1e293b"/>
    <text x="270" y="32" fill="#94a3b8" font-size="12" font-weight="600">TOKEN MAPPINGS</text>
    <text x="270" y="70" fill="#34d399" font-size="28" font-weight="800">14 <tspan font-size="16" fill="#64748b">tokens</tspan></text>
    <rect x="495" y="0" width="235" height="110" rx="12" fill="#0f172a" stroke="#1e293b"/>
    <text x="515" y="32" fill="#94a3b8" font-size="12" font-weight="600">SIMULATED LATENCY</text>
    <text x="515" y="70" fill="#facc15" font-size="28" font-weight="800">42.5 <tspan font-size="16" fill="#64748b">&mu;s</tspan></text>
    <g transform="translate(0, 130)">
      <rect width="730" height="510" rx="12" fill="#0f172a" stroke="#1e293b"/>
      <text x="24" y="36" fill="#e2e8f0" font-size="16" font-weight="700">10-Point Normative Protocol Audit Scorecard</text>
      <text x="600" y="36" fill="#34d399" font-size="13" font-weight="700">10/10 PASS (100%)</text>
      <line x1="24" y1="54" x2="706" y2="54" stroke="#1e293b"/>
      <text x="36" y="86" fill="#f1f5f9" font-size="13">&#x2713; Clause 3.1: Canonical URI UTF-8 Key Expressions</text>
      <text x="36" y="126" fill="#f1f5f9" font-size="13">&#x2713; Clause 3.2: Multi-level (**) and single-level (*) glob routing</text>
      <text x="36" y="166" fill="#f1f5f9" font-size="13">&#x2713; Clause 4.1: Compact LEB128/ZInt encoding with MSB continuation</text>
      <text x="36" y="206" fill="#f1f5f9" font-size="13">&#x2713; Clause 5.1: Zero-copy PUT framing &amp; priority index</text>
      <text x="36" y="246" fill="#f1f5f9" font-size="13">&#x2713; Clause 5.3: GET queryable dispatch &amp; consolidation criteria</text>
      <text x="36" y="286" fill="#f1f5f9" font-size="13">&#x2713; Clause 5.4: Transaction response binding with sequence synchronization</text>
      <text x="36" y="326" fill="#f1f5f9" font-size="13">&#x2713; Clause 6.1: DECLARE numerical resource ID token mapping</text>
      <text x="36" y="366" fill="#f1f5f9" font-size="13">&#x2713; Clause 7.2: Backpressure management with BLOCK and DROP</text>
      <text x="36" y="406" fill="#f1f5f9" font-size="13">&#x2713; Clause 8.1: Full byte-level state equality round-trip</text>
      <text x="36" y="446" fill="#f1f5f9" font-size="13">&#x2713; Performance: Sub-10 byte wire header overhead for ROS 2 rmw_zenoh</text>
    </g>
  </g>
</svg>